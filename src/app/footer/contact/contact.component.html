<div class="flex items-center justify-between border-b border-white/10 px-6 py-4">
  <h2 class="flex items-center gap-2 font-display text-lg font-bold text-white">
    <span class="material-icons-round text-brand-400">mail</span>Contact Us
  </h2>
  <button mat-icon-button (click)="onCancel()" aria-label="Close dialog">
    <mat-icon class="text-zinc-400">close</mat-icon>
  </button>
</div>

<mat-dialog-content class="!px-6 !py-6">
  <p class="mb-5 text-sm text-zinc-400">Feel free to reach out to me through the following platforms:</p>

  <div class="grid gap-3 sm:grid-cols-2">
    <a
      href="mailto:mayureshpatrikar24@gmail.com"
      class="group flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[.03] p-4 transition hover:border-brand-500/40 hover:bg-white/[.06]"
      matTooltip="Click to send an email"
      matTooltipPosition="above"
    >
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-500/15 text-brand-400">
        <span class="material-icons-round text-[20px]">mail</span>
      </span>
      <span>
        <span class="block text-sm font-semibold text-white">Email</span>
        <span class="block text-xs text-zinc-500 group-hover:text-zinc-400">Send me a message</span>
      </span>
    </a>

    <a
      href="https://www.linkedin.com/in/mayureshpatrikar/"
      target="_blank"
      rel="noopener noreferrer"
      class="group flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[.03] p-4 transition hover:border-accent-500/40 hover:bg-white/[.06]"
      matTooltip="Click to connect on LinkedIn"
      matTooltipPosition="below"
    >
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-accent-500/15 text-accent-400">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11H3v-11Zm7 0h3.8v1.5h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.6 4.77 6v5.55h-4v-4.92c0-1.17-.02-2.68-1.66-2.68-1.66 0-1.92 1.28-1.92 2.6v5h-4v-11Z"/></svg>
      </span>
      <span>
        <span class="block text-sm font-semibold text-white">LinkedIn</span>
        <span class="block text-xs text-zinc-500 group-hover:text-zinc-400">Connect with me</span>
      </span>
    </a>
  </div>
</mat-dialog-content>
