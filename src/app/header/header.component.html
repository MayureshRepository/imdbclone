<header
  class="sticky top-0 z-40 border-b border-white/5 bg-ink-950/75 backdrop-blur-xl supports-[backdrop-filter]:bg-ink-950/60"
>
  <div class="page flex h-16 items-center gap-3 sm:gap-6">
    <!-- Logo -->
    <a routerLink="/home" class="group flex shrink-0 items-center gap-2" aria-label="AMDb home">
      <span
        class="rounded-md bg-brand-500 px-2 py-0.5 font-display text-lg font-extrabold tracking-tight text-onbrand transition group-hover:shadow-glow"
        >AMDb</span
      >
      <span class="hidden text-xs font-medium text-zinc-500 lg:inline">A IMDb Clone</span>
    </a>

    <!-- Search -->
    <div class="search-container relative mx-auto w-full max-w-xl">
      <form (ngSubmit)="onSearch()" class="relative" role="search">
        <span
          class="material-icons-round pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-zinc-500"
          >search</span
        >
        <input
          type="text"
          name="search"
          autocomplete="off"
          [(ngModel)]="searchText"
          (ngModelChange)="onSearchTextChange($event)"
          (focus)="dataFromSearch.length && (isDropDownOpen = true)"
          (keydown.escape)="isDropDownOpen = false"
          placeholder="Search movies, shows..."
          aria-label="Search movies and shows"
          class="h-10 w-full rounded-full border border-white/10 bg-white/5 pl-10 pr-24 text-sm text-white placeholder-zinc-500 transition focus:border-accent-500/60 focus:bg-white/10 focus:outline-none focus:ring-4 focus:ring-accent-500/20"
        />
        <button
          type="submit"
          class="btn-primary absolute right-1 top-1/2 hidden h-8 -translate-y-1/2 px-4 py-0 text-xs sm:inline-flex"
          aria-label="Search"
        >
          Search
        </button>
      </form>

      <!-- Dropdown results -->
      <div
        *ngIf="isDropDownOpen"
        class="absolute left-0 right-0 top-full z-50 mt-2 max-h-[70vh] overflow-y-auto rounded-2xl border border-white/10 bg-ink-850/95 p-2 shadow-2xl backdrop-blur-xl animate-fade-up"
      >
        <ng-container *ngIf="isLoading; else searchResults">
          <div *ngFor="let s of [1, 2, 3]" class="flex items-center gap-3 p-2">
            <div class="skeleton h-16 w-11 shrink-0 rounded-md"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton h-3 w-2/3 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
        </ng-container>

        <ng-template #searchResults>
          <ng-container *ngIf="dataFromSearch && dataFromSearch.length > 0; else noResults">
            <button
              type="button"
              *ngFor="let item of dataFromSearch"
              class="flex w-full items-center gap-3 rounded-xl p-2 text-left transition hover:bg-white/5 focus:bg-white/5 focus:outline-none"
              (click)="onSelect(item)"
            >
              <img
                [src]="item.Poster"
                alt=""
                loading="lazy"
                (error)="onImageError($event)"
                class="h-16 w-11 shrink-0 rounded-md object-cover ring-1 ring-white/10"
              />
              <div class="min-w-0 flex-1">
                <h3 class="truncate text-sm font-semibold text-white">{{ item.Title }}</h3>
                <p class="mt-0.5 flex items-center gap-2 text-xs text-zinc-400">
                  <span>{{ item.Year }}</span>
                  <span class="h-1 w-1 rounded-full bg-zinc-600"></span>
                  <span class="capitalize">{{ item.Type }}</span>
                </p>
              </div>
              <span class="material-icons-round text-[18px] text-zinc-600">chevron_right</span>
            </button>
          </ng-container>
        </ng-template>

        <ng-template #noResults>
          <div class="flex flex-col items-center gap-1 px-4 py-6 text-center">
            <span class="material-icons-round text-3xl text-zinc-600">movie_filter</span>
            <p class="text-sm text-zinc-400">No results found</p>
            <p class="text-xs text-zinc-600">Try a different title</p>
          </div>
        </ng-template>
      </div>
    </div>

    <!-- Favorites -->
    <a
      routerLink="/favorites"
      routerLinkActive="!border-brand-500/60 !text-brand-400"
      class="btn-ghost relative shrink-0 px-3 sm:px-4"
      matTooltip="Go to Favorites"
      aria-label="Favorites"
    >
      <span class="material-icons-round text-[20px] text-rose-500">favorite</span>
      <span class="hidden sm:inline">Favorites</span>
      <span
        class="absolute -right-1.5 -top-1.5 grid h-5 min-w-5 place-items-center rounded-full bg-brand-500 px-1 text-[11px] font-bold text-onbrand ring-2 ring-ink-950"
      >
        {{ favoritesCount?.length || 0 }}
      </span>
    </a>

    <!-- Theme toggle -->
    <button
      type="button"
      class="btn-ghost group h-10 w-10 shrink-0 !p-0"
      (click)="theme.toggle()"
      [matTooltip]="theme.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-label]="theme.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="!theme.isDark"
    >
      <span
        class="material-icons-round text-[20px] transition duration-300 group-hover:rotate-12"
        [class.text-brand-400]="theme.isDark"
        [class.text-indigo-500]="!theme.isDark"
        >{{ theme.isDark ? 'light_mode' : 'dark_mode' }}</span
      >
    </button>
  </div>
</header>
