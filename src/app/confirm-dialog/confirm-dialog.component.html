<div class="px-6 pb-2 pt-6 text-center">
  <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-red-500/10 ring-1 ring-red-500/25">
    <span class="material-icons-round text-3xl text-red-400">delete_forever</span>
  </div>
  <h2 class="font-display text-lg font-bold text-white">{{ data.title || 'Are you sure?' }}</h2>
  <p class="mt-2 text-sm text-zinc-400">{{ data.message }}</p>
</div>

<div class="flex justify-end gap-2 px-6 pb-6 pt-4">
  <button type="button" class="btn-ghost flex-1" (click)="onCancel()">Cancel</button>
  <button type="button" class="btn flex-1 bg-red-500 text-snow hover:bg-red-400" (click)="onConfirm()">
    Delete all
  </button>
</div>
