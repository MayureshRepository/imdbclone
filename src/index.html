<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AMDb — Discover Movies &amp; TV Shows</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b16" />
    <meta
      name="description"
      content="AMDb is a fast, modern IMDb-style app to search movies and TV shows and keep a list of favorites."
    />
    <!-- Apply the saved theme before first paint (dark is the default). -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5fb');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
